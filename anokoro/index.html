<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あの頃の戦隊 - anokoro</title>
    <style>
        :root { --sentai-color: #e67e22; --bg-color: #f9f9f9; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: var(--bg-color); padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* 3段表示エリア */
        .focus-area { display: flex; flex-direction: column; gap: 15px; padding: 20px 0; }
        
        .prev-item { text-align: left; font-size: 0.9rem; color: #888; border-bottom: 1px dashed #ddd; padding-bottom: 5px; }
        .current-item { text-align: center; padding: 20px 0; }
        .current-item .title { font-size: 2rem; font-weight: bold; color: var(--sentai-color); display: block; line-height: 1.2; }
        .current-item .period { font-size: 0.8rem; color: #666; margin-top: 8px; display: block; }
        .next-item { text-align: right; font-size: 0.9rem; color: #888; border-top: 1px dashed #ddd; padding-top: 5px; }

        input[type="date"], input[type="range"] { width: 100%; margin-top: 10px; }
        .label-text { font-weight: bold; font-size: 0.9rem; color: #555; }
        .age-badge { font-size: 1.5rem; color: var(--sentai-color); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <label class="label-text">誕生日:</label>
        <input type="date" id="birthDate" value="1995-01-01">
        
        <div style="text-align:center; margin-top: 20px;">
            <span id="ageDisplay" class="age-badge">5 歳のころ</span>
            <input type="range" id="ageSlider" min="3" max="15" value="5">
            <p id="dateDisplay" style="color:#888;">2000年1月1日</p>
        </div>
    </div>

    <div class="card focus-area" id="displayArea">
        </div>
</div>

<script>
    let masterpieceData = [];

    async function loadData() {
        // カテゴリーを「戦隊」のみに絞って読み込み（想定）
        const response = await fetch('data.json');
        const allData = await response.json();
        masterpieceData = allData.filter(item => item.category === "戦隊")
                                 .sort((a, b) => new Date(a.start) - new Date(b.start));
        updateDisplay();
    }

    function updateDisplay() {
        const birthDate = new Date(document.getElementById('birthDate').value);
        const age = parseInt(document.getElementById('ageSlider').value);
        const targetDate = new Date(birthDate);
        targetDate.setFullYear(birthDate.getFullYear() + age);
        
        document.getElementById('ageDisplay').innerText = `${age} 歳のころ`;
        document.getElementById('dateDisplay').innerText = `${targetDate.getFullYear()}年${targetDate.getMonth()+1}月${targetDate.getDate()}日`;

        // 現在の作品のインデックスを探す
        const currentIndex = masterpieceData.findIndex(item => {
            const start = new Date(item.start);
            const end = new Date(item.end);
            return targetDate >= start && targetDate <= end;
        });

        renderThreeTier(currentIndex);
    }

    function renderThreeTier(index) {
        const area = document.getElementById('displayArea');
        area.innerHTML = '';

        if (index === -1) {
            area.innerHTML = '<p style="text-align:center; color:#999;">データがありません</p>';
            return;
        }

        const current = masterpieceData[index];
        const prev = masterpieceData[index - 1];
        const next = masterpieceData[index + 1];

        // 1段目（前：左寄せ）
        const prevHtml = prev ? `<div class="prev-item">前作：${prev.title}</div>` : '<div class="prev-item">-</div>';
        
        // 2段目（今：中央大）
        const currentHtml = `
            <div class="current-item">
                <span class="title">${current.title}</span>
                <span class="period">${current.start} 〜 ${current.end}</span>
            </div>
        `;
        
        // 3段目（次：右寄せ）
        const nextHtml = next ? `<div class="next-item">次作：${next.title}</div>` : '<div class="next-item">-</div>';

        area.innerHTML = prevHtml + currentHtml + nextHtml;
    }

    document.getElementById('ageSlider').addEventListener('input', updateDisplay);
    document.getElementById('birthDate').addEventListener('change', updateDisplay);
    loadData();
</script>

</body>
</html>
