<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>あの頃のヒーロー - anokoro</title>
    
<link rel="icon" href="tantei307.png" type="image/png">

<link rel="apple-touch-icon" href="tantei307.png">

    
    <style>
        :root { 
            --sentai-color: #ff4757; --rider-color: #2ed573; --ultra-color: #1e90ff; 
            --metal-color: #ced4da; --bg-base: #1a1a1a;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; background-color: var(--bg-base);
            margin: 0; padding: 20px; color: #fff; transition: background 0.5s ease; 
            min-height: 100vh; overflow-x: hidden;
        }
        body.戦隊 { background-color: #4a0000; }
        body.仮面ライダー { background-color: #002b00; }
        body.ウルトラマン { background-color: #001a33; }
        body.メタルヒーロー { background-color: #2c3e50; }

        .container { max-width: 500px; margin: 0 auto; position: relative; z-index: 10; }

        /* タブ */
        .tabs { display: flex; gap: 8px; margin-bottom: 25px; overflow-x: auto; padding: 5px; }
        .tab-btn { 
            flex: 1; padding: 14px 5px; border: none; border-radius: 12px; 
            background: rgba(255,255,255,0.1); color: #aaa; cursor: pointer; font-weight: bold; 
            font-size: 0.8rem; -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active { color: #fff; transform: translateY(-2px); }
        .tab-btn.active[data-cat="戦隊"] { background: var(--sentai-color); }
        .tab-btn.active[data-cat="仮面ライダー"] { background: var(--rider-color); }
        .tab-btn.active[data-cat="ウルトラマン"] { background: var(--ultra-color); }
        .tab-btn.active[data-cat="メタルヒーロー"] { background: var(--metal-color); color: #333; }

        .card { 
            background: rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); margin-bottom: 25px; 
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
        }
        
        .birth-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        input[type="date"] { flex: 1; padding: 12px; border-radius: 10px; border: none; background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; }
        .current-age-badge { background: rgba(255,255,255,0.2); padding: 10px 15px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; }
        
        .age-badge { display: inline-block; padding: 8px 30px; border-radius: 30px; font-size: 1.6rem; font-weight: 900; }

        /* スライダー調整エリア */
        .slider-controls { display: flex; align-items: center; gap: 15px; margin-top: 15px; }
        .step-btn { 
            background: rgba(255,255,255,0.1); border: none; color: white; 
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer; 
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
            /* iPhoneのズーム防止と選択防止 */
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        input[type="range"] { flex: 1; -webkit-appearance: none; height: 8px; border-radius: 5px; background: rgba(255,255,255,0.1); outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; cursor: pointer; }

        .display-card { 
            background: rgba(0,0,0,0.4); padding: 30px 25px; border-radius: 25px; 
            border: 2px solid rgba(255,255,255,0.05); min-height: 280px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .prev-item { text-align: left; color: #888; font-size: 0.85rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        .current-item { text-align: center; padding: 10px 0; }
        .current-item .title { font-size: 2rem; font-weight: 900; line-height: 1.2; margin: 15px 0; display: block; }
        .next-item { text-align: right; color: #888; font-size: 0.85rem; font-weight: bold; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }

        /* 紙吹雪：最前面（z-index: 9999） */
        .confetti {
            position: fixed; width: 10px; height: 10px; z-index: 9999;
            top: -10px; pointer-events: none; animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }

        #birthdayMsg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; font-weight: 900; color: #ffeb3b; text-shadow: 0 0 20px rgba(255,235,59,0.8);
            z-index: 10000; pointer-events: none; opacity: 0; transition: opacity 0.5s; text-align: center; width: 100%;
        }
    </style>
</head>
<body class="戦隊">

<div id="birthdayMsg">HAPPY BIRTHDAY!</div>
<div class="container">
    <div class="tabs">
        <button class="tab-btn active" data-cat="戦隊">戦隊</button>
        <button class="tab-btn" data-cat="仮面ライダー">ライダー</button>
        <button class="tab-btn" data-cat="ウルトラマン">ウルトラ</button>
        <button class="tab-btn" data-cat="メタルヒーロー">メタル</button>
    </div>

    <div class="card" style="text-align:center;">
        <div class="birth-row">
            <input type="date" id="birthDate">
            <div id="currentAgeDisplay" class="current-age-badge">-- 歳</div>
        </div>
        <div id="ageDisplay" class="age-badge">5 歳のころ</div>
        <p id="dateDisplay" style="margin:10px 0; font-weight: bold; color: #ddd;">----年--月--日</p>
        <div class="slider-controls">
            <button class="step-btn" onclick="stepSlider(-1)">◀</button>
            <input type="range" id="ageSlider" min="0" max="60" value="5">
            <button class="step-btn" onclick="stepSlider(1)">▶</button>
        </div>
    </div>
    <div class="display-card" id="displayArea"></div>
</div>

<script>
    let allData = [];
    let currentCategory = "戦隊";
    let celebratedAges = new Set();

    async function loadData() {
        const savedBirth = localStorage.getItem('userBirthDate');
        document.getElementById('birthDate').value = savedBirth || "1995-01-01";
        try {
            const response = await fetch('data.json?v=' + new Date().getTime());
            allData = await response.json();
            updateDisplay();
        } catch(e) { console.error("Data load error", e); }
    }

    function stepSlider(val) {
        const slider = document.getElementById('ageSlider');
        let nextVal = parseInt(slider.value) + val;
        if (nextVal >= slider.min && nextVal <= slider.max) {
            slider.value = nextVal;
            updateDisplay();
        }
    }

    function createConfetti() {
        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffeb3b', '#ffffff'];
        for (let i = 0; i < 60; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            c.style.animationDuration = (Math.random() * 2 + 2) + 's';
            c.style.width = (Math.random() * 8 + 5) + 'px';
            c.style.height = (Math.random() * 8 + 5) + 'px';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 4000);
        }
    }

    function updateDisplay() {
        const birthDateVal = document.getElementById('birthDate').value;
        if (!birthDateVal) return;
        localStorage.setItem('userBirthDate', birthDateVal);

        const birthDate = new Date(birthDateVal);
        const age = parseInt(document.getElementById('ageSlider').value);
        const today = new Date();
        
        let currentAge = today.getFullYear() - birthDate.getFullYear();
        if (today.getMonth() < birthDate.getMonth() || (today.getMonth() === birthDate.getMonth() && today.getDate() < birthDate.getDate())) {
            currentAge--;
        }
        document.getElementById('currentAgeDisplay').innerText = `現在 ${currentAge} 歳`;

        const isBirthdayToday = today.getMonth() === birthDate.getMonth() && today.getDate() === birthDate.getDate();
        if (age === currentAge && isBirthdayToday && !celebratedAges.has(age)) {
            createConfetti();
            const msg = document.getElementById('birthdayMsg');
            msg.style.opacity = 1;
            setTimeout(() => { msg.style.opacity = 0; }, 3000);
            celebratedAges.add(age);
        }

        const targetDate = new Date(birthDate);
        targetDate.setFullYear(birthDate.getFullYear() + age);
        document.getElementById('ageDisplay').innerText = `${age} 歳のころ`;
        document.getElementById('dateDisplay').innerText = `${targetDate.getFullYear()}年${targetDate.getMonth()+1}月${targetDate.getDate()}日 ごろ`;
        
        const filtered = allData.filter(item => item.category === currentCategory).sort((a, b) => new Date(a.start) - new Date(b.start));
        let idx = filtered.findIndex(item => targetDate >= new Date(item.start) && targetDate <= new Date(item.end));
        let current, prev, next;

        if (idx !== -1) {
            current = filtered[idx]; prev = filtered[idx - 1]; next = filtered[idx + 1];
        } else {
            const prevs = filtered.filter(item => new Date(item.end) < targetDate);
            prev = prevs.length > 0 ? prevs[prevs.length - 1] : null;
            next = filtered.find(item => new Date(item.start) > targetDate);
            current = { title: "（放映なし）", start: "-", end: "-" };
        }
        render(current, prev, next);
    }

    function render(c, p, n) {
        const colors = {"戦隊": ["#ff4757", "rgba(255,71,87,0.6)"], "仮面ライダー": ["#2ed573", "rgba(46,213,115,0.6)"], "ウルトラマン": ["#1e90ff", "rgba(30,144,255,0.6)"], "メタルヒーロー": ["#ced4da", "rgba(255,255,255,0.4)"]};
        const [themeColor, glowColor] = colors[currentCategory];
        document.getElementById('displayArea').innerHTML = `
            <div class="prev-item">${p ? '◀ 前作：' + p.title : ''}</div>
            <div class="current-item">
                <span class="title" style="color:${c.start==='-'?'#444':themeColor}; text-shadow: 0 0 20px ${c.start==='-'?'transparent':glowColor}">${c.title}</span>
                <span style="font-size:0.8rem; color:#aaa;">${c.start} 〜 ${c.end}</span>
            </div>
            <div class="next-item">${n ? '次作：' + n.title + ' ▶' : ''}</div>
        `;
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelector('.tab-btn.active').classList.remove('active');
            e.target.classList.add('active');
            currentCategory = e.target.dataset.cat;
            document.body.className = currentCategory;
            updateDisplay();
        });
    });

    document.getElementById('ageSlider').addEventListener('input', updateDisplay);
    document.getElementById('birthDate').addEventListener('change', updateDisplay);
    loadData();
</script>
</body>
</html>
