<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あの頃のヒーロー - anokoro</title>
    <style>
        :root { --primary-color: #ff4757; --highlight-color: #fff9c4; }
        body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; background: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* 入力エリア */
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input[type="date"], input[type="range"] { width: 100%; box-sizing: border-box; }
        
        /* スライダーエリア */
        .age-badge { display: inline-block; background: var(--primary-color); color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 1.2rem; }
        .current-date { font-size: 1.1rem; color: #666; margin: 10px 0; }

        /* タイムライン表示 */
        .timeline-container { height: 400px; overflow-y: auto; background: #fff; border-radius: 10px; border: 1px solid #ddd; padding: 10px; scroll-behavior: smooth; }
        .timeline-item { display: flex; padding: 12px; border-bottom: 1px solid #eee; transition: 0.3s; align-items: center; }
        .timeline-item.active { background-color: var(--highlight-color); border-left: 5px solid var(--primary-color); transform: scale(1.02); }
        .year-label { font-size: 0.8rem; color: #888; width: 100px; flex-shrink: 0; }
        .title-label { font-weight: bold; flex-grow: 1; }
        .category-label { font-size: 0.7rem; background: #eee; padding: 2px 6px; border-radius: 4px; }

        h1 { color: var(--primary-color); font-size: 1.5rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>あの頃のヒーロー</h1>

    <div class="card">
        <div class="input-group">
            <label>あなたの誕生日:</label>
            <input type="date" id="birthDate" value="1995-01-01">
        </div>

        <div class="input-group">
            <div style="text-align:center;">
                <span id="ageDisplay" class="age-badge">5 歳のころ</span>
                <p id="dateDisplay" class="current-date">2000年1月1日 ごろ</p>
            </div>
            <input type="range" id="ageSlider" min="0" max="18" value="5">
        </div>
    </div>

    <div class="timeline-container" id="timeline">
        </div>
</div>

<script>
    let masterpieceData = [];

    // 1. データの読み込み
    async function loadData() {
        try {
            const response = await fetch('data.json');
            masterpieceData = await response.json();
            // 放映開始順にソート
            masterpieceData.sort((a, b) => new Date(a.start) - new Date(b.start));
            updateDisplay();
        } catch (error) {
            console.error("データが読み込めませんでした", error);
        }
    }

    const birthDateInput = document.getElementById('birthDate');
    const ageSlider = document.getElementById('ageSlider');
    const ageDisplay = document.getElementById('ageDisplay');
    const dateDisplay = document.getElementById('dateDisplay');
    const timeline = document.getElementById('timeline');

    // 2. 表示更新
    function updateDisplay() {
        const birthDate = new Date(birthDateInput.value);
        if (isNaN(birthDate)) return;

        const age = parseInt(ageSlider.value);
        
        // ターゲット日を計算（誕生日の○年後）
        const targetDate = new Date(birthDate);
        targetDate.setFullYear(birthDate.getFullYear() + age);
        
        const y = targetDate.getFullYear();
        const m = targetDate.getMonth() + 1;
        const d = targetDate.getDate();

        ageDisplay.innerText = `${age} 歳のころ`;
        dateDisplay.innerText = `${y}年${m}月${d}日 ごろ`;

        renderTimeline(targetDate);
    }

    // 3. タイムラインの描画
    function renderTimeline(targetDate) {
        timeline.innerHTML = '';

        masterpieceData.forEach((item, index) => {
            const start = new Date(item.start);
            const end = new Date(item.end);
            
            const div = document.createElement('div');
            div.className = 'timeline-item';
            
            // ターゲット日が放映期間内か判定
            const isActive = targetDate >= start && targetDate <= end;
            if (isActive) {
                div.className += ' active';
                div.id = 'active-item'; // スクロール用
            }

            div.innerHTML = `
                <div class="year-label">${start.getFullYear()}/${start.getMonth()+1}〜</div>
                <div class="title-label">${item.title}</div>
                <div class="category-label">${item.category}</div>
            `;
            timeline.appendChild(div);
        });

        // アクティブな要素まで自動スクロール
        const activeElem = document.getElementById('active-item');
        if (activeElem) {
            timeline.scrollTo({
                top: activeElem.offsetTop - timeline.offsetTop - 150,
                behavior: 'smooth'
            });
        }
    }

    // イベント登録
    ageSlider.addEventListener('input', updateDisplay);
    birthDateInput.addEventListener('change', updateDisplay);

    loadData();
</script>

</body>
</html>
