<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>【DEBUG】Eki Bottle Mail</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="bottle307.png">
    <link rel="icon" href="bottle307.png">
    <style>
        :root { --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); }
        body { margin: 0; padding: 0; font-family: sans-serif; background: linear-gradient(180deg, #2c3e50 0%, #4ca1af 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; color: #ffffff; padding-top: calc(20px + var(--sat)); padding-bottom: calc(120px + var(--sab)); }
        .debug-badge { background: #e74c3c; color: white; padding: 2px 10px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; margin-bottom: 10px; }
        .container { width: 90%; max-width: 400px; text-align: center; }
        .user-profile-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .user-profile { font-size: 0.8rem; color: #ffffff; background: rgba(0,0,0,0.2); padding: 5px 15px; border-radius: 20px; display: inline-block; }
        #my-name-display { color: #f1c40f; font-weight: bold; }
        .settings-icon { cursor: pointer; font-size: 1.2rem; color: rgba(255,255,255,0.8); }
        h1 { font-size: 1.5rem; color: #ffffff; text-shadow: 1px 1px 4px rgba(0,0,0,0.2); margin-top: 0; }
        
        .station-box { background: rgba(255, 255, 255, 0.2); padding: 15px; border-radius: 20px; margin-bottom: 20px; font-weight: bold; backdrop-filter: blur(5px); min-height: 20px; border: 2px dashed #f1c40f; cursor: pointer; }
        .station-box:active { background: rgba(255, 255, 255, 0.4); }

        .bottle-card { background: #ffffff; padding: 25px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; color: #334d66; }
        textarea { width: 100%; height: 100px; border: 1px solid #e0e7ff; border-radius: 15px; padding: 12px; box-sizing: border-box; font-size: 16px; background: #f9fbff; -webkit-appearance: none; resize: none; outline: none; }
        .action-area { display: flex; gap: 8px; }
        .btn-send { background: #5dade2; color: white; border: none; padding: 15px; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-refresh { background: #5dade2; border: none; border-radius: 15px; width: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
        .history-section { width: 100%; text-align: left; margin-top: 20px; }
        .history-title { font-size: 0.9rem; font-weight: bold; color: #ffffff; margin-bottom: 10px; }
        .history-item { background: rgba(255, 255, 255, 0.2); padding: 12px; border-radius: 15px; margin-bottom: 10px; font-size: 0.85rem; cursor: pointer; }
        .history-meta { font-size: 0.7rem; color: #eee; margin-top: 4px; }
        .btn-pick-up { position: fixed; bottom: calc(20px + var(--sab)); left: 50%; transform: translateX(-50%); width: 95px; height: 95px; border: 4px solid white; border-radius: 50%; background: url('bottle307.png') no-repeat center center; background-size: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.3); cursor: pointer; z-index: 10; outline: none; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; color: #334d66; }
        .modal { background: white; padding: 20px; border-radius: 20px; width: 85%; text-align: center; max-width: 350px; max-height: 85vh; overflow-y: auto; }
        .main-message-box { background: #f0f7ff; padding: 15px; border-radius: 15px; margin-bottom: 5px; text-align: left; }
        
        #station-info-area { padding: 10px 0; margin: 15px 0; font-size: 0.8rem; color: #8899aa; border-top: 1px dashed #ddd; border-bottom: 1px dashed #ddd; line-height: 1.6; cursor: pointer; }
        .debug-target { color: #e74c3c; font-weight: bold; text-decoration: underline; }

        .btn-close { margin-top: 20px; background: #eee; border: none; padding: 10px 20px; border-radius: 20px; width: 100%; cursor: pointer; }
        .transfer-box { background: #f4f7f9; padding: 12px; border-radius: 15px; margin: 10px 0; text-align: left; border: 1px solid #e0e7ff; }
        .transfer-id { font-family: monospace; font-weight: bold; color: #1a2a6c; display: block; background: #fff; padding: 5px; margin: 5px 0; text-align: center; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="debug-badge">DEBUG MODE (Location Fake Enabled)</div>
    <div class="container">
        <div class="user-profile-wrapper">
            <div class="user-profile">あなたは <span id="my-name-display">...</span> です</div>
            <div class="settings-icon" onclick="openSettings()">⚙️</div>
        </div>
        <h1>Eki Bottle Mail</h1>
        <div id="station-display" class="station-box" onclick="fakeMainStation()">
            <span id="current-station-text">駅を探しています...</span>
            <div style="font-size:0.6rem; opacity:0.8; margin-top:5px;">[タップして駅名を偽装]</div>
        </div>
        <div class="bottle-card">
            <textarea id="message-input" placeholder="今の駅にメッセージを置く..."></textarea>
            <div class="action-area">
                <button id="send-btn" class="btn-send">ボトルを置く</button>
                <button id="main-refresh-btn" class="btn-refresh">
                    <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
            </div>
        </div>
        <div class="history-section"><div class="history-title">📬 置いたボトル</div><div id="my-bottles-list"></div></div>
        <div class="history-section"><div class="history-title">📩 返信したボトル</div><div id="my-replies-list"></div></div>
    </div>

    <button id="pick-btn" class="btn-pick-up"></button>

    <div id="bottle-overlay" class="overlay">
        <div class="modal">
            <div id="bottle-content">
                <div class="main-message-box">
                    <div id="picked-sender" style="font-size: 0.75rem; font-weight: bold; margin-bottom: 5px;"></div>
                    <div id="picked-text" style="font-size: 1.1rem; line-height: 1.5; margin: 8px 0;"></div>
                    <div id="picked-station" style="font-size: 0.65rem; color: #99aabb; text-align: right;"></div>
                </div>
                <div id="station-info-area" onclick="fakeBottlePlaceStation()"></div>
                <div id="reply-list"></div>
                <div class="reply-input-area" id="reply-form-area" style="display:flex; flex-direction:column; gap:10px; margin-top:15px;">
                    <textarea id="reply-input" placeholder="返信を書く..." style="height:60px; font-size:14px; border:1px solid #eee; border-radius:10px; padding:8px;"></textarea>
                    <button id="reply-back-btn" class="btn-send" style="background:#a1c4fd; font-size:0.9rem;">元の駅にボトルを置く</button>
                    <div class="action-area">
                        <button id="reply-place-btn" class="btn-send" style="background:#5dade2; flex:1; font-size:0.9rem;">最寄駅にボトルを置く</button>
                        <button id="reply-refresh-btn" class="btn-refresh">
                            <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div id="empty-message" style="display:none; padding:30px 0;">ボトルは見つかりませんでした。</div>
            <button onclick="closeModals()" class="btn-close">戻る</button>
        </div>
    </div>

    <div id="settings-overlay" class="overlay">
        <div class="modal">
            <h2 style="font-size: 1.1rem; margin-top:0;">設定</h2>
            <div class="transfer-box">
                <small style="color:#8899aa;">引き継ぎコード</small>
                <span class="transfer-id" id="display-user-id">----</span>
                <button id="copy-id-btn" style="font-size:0.7rem; width:100%; border:1px solid #5dade2; background:none; color:#5dade2; border-radius:5px; padding:5px; cursor:pointer;" onclick="copyMyId(event)">コードをコピー</button>
            </div>
            <div class="transfer-box">
                <small style="color:#8899aa;">他端末から復元</small>
                <input type="text" id="import-id-input" placeholder="コードを入力" style="width:100%; padding:8px; box-sizing:border-box; border-radius:8px; border:1px solid #ddd; margin-top:5px;">
                <button class="btn-send" style="margin-top:8px; padding:10px; font-size:0.8rem; width:100%;" onclick="importUser()">復元を実行</button>
            </div>
            <button class="btn-close" style="background:#5dade2; color:white; margin-bottom:10px;" onclick="resetNickname()">名前だけ変更する</button>
            <button class="btn-close" style="background:#e74c3c; color:white;" onclick="resetAll()">全データをリセット</button>
            <button onclick="closeModals()" class="btn-close">閉じる</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDoc, getDocs, query, limit, serverTimestamp, updateDoc, doc, where, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = { apiKey: "AIzaSyD4-mJxug55N26rxomekf1Tvn9YgToacTY", authDomain: "nakami-88027.firebaseapp.com", projectId: "nakami-88027", storageBucket: "nakami-88027.firebasestorage.app", messagingSenderId: "316064567852", appId: "1:316064567852:web:85642cd678d7b4160b7789" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let currentStation = "どこかの駅", myName = "", myUserId = "";
        let isFaked = false;

        // --- DEBUG FUNCTIONS ---
        window.fakeMainStation = () => {
            const newName = prompt("【DEBUG】新しい現在地を入力してください", currentStation);
            if (newName) {
                currentStation = newName;
                isFaked = true;
                document.getElementById('current-station-text').innerText = currentStation + " [偽装中]";
            }
        };

        window.fakeBottlePlaceStation = () => {
            if (window.isFromHistory) return;
            const newName = prompt("【DEBUG】ボトルを置く位置を偽装しますか？", currentStation);
            if (newName) {
                currentStation = newName;
                isFaked = true;
                document.getElementById('current-station-text').innerText = currentStation + " [偽装中]";
                updateStationInfoDisplay(window.lastPickedData.station, false);
            }
        };

        function generateId() { return Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.random().toString(36).substring(2, 6).toUpperCase(); }
        function generateName() { const colors = ["茜色","瑠璃色","琥珀色","翡翠色","浅葱色","藤色","銀鼠色","群青色"]; const jobs = ["旅人","かもめ","漂流者","灯台守","詩人","奏者"]; return colors[Math.floor(Math.random()*colors.length)] + "の" + jobs[Math.floor(Math.random()*jobs.length)] + "さん"; }

        function saveToLocalHistory(key, id, text) {
            let list = JSON.parse(localStorage.getItem(key) || '[]');
            list = list.filter(i => i.id !== id);
            list.unshift({ id, text: text.substring(0, 15) + "...", date: new Date().toLocaleTimeString() });
            localStorage.setItem(key, JSON.stringify(list.slice(0, 10)));
            renderAllLocalHistories();
        }

        function renderAllLocalHistories() {
            renderList('sharedMyBottles', 'my-bottles-list');
            renderList('myReplyBottles', 'my-replies-list');
        }

        function renderList(key, elementId) {
            const div = document.getElementById(elementId);
            const list = JSON.parse(localStorage.getItem(key) || '[]');
            div.innerHTML = list.length ? "" : "<p style='font-size:0.75rem; color:rgba(255,255,255,0.6)'>なし</p>";
            list.forEach(i => {
                const h = document.createElement('div'); h.className = 'history-item';
                h.innerHTML = `<div>${i.text}</div><div class="history-meta">${i.date}</div>`;
                h.onclick = () => showSpecificBottle(i.id); 
                div.appendChild(h);
            });
        }

        async function initUser() {
            myUserId = localStorage.getItem('ekiUserId');
            if(!myUserId) {
                myUserId = generateId(); myName = generateName();
                localStorage.setItem('ekiUserId', myUserId);
                localStorage.setItem('ekiUserNickname', myName);
                await setDoc(doc(db, "users", myUserId), { nickname: myName, createdAt: serverTimestamp() });
            } else {
                const uDoc = await getDoc(doc(db, "users", myUserId));
                if(uDoc.exists()) myName = uDoc.data().nickname;
                else myName = localStorage.getItem('ekiUserNickname') || generateName();
            }
            document.getElementById('my-name-display').innerText = myName;
            document.getElementById('display-user-id').innerText = myUserId;
            renderAllLocalHistories();
        }

        async function getStation(updateUI = true) {
            if(isFaked && !updateUI) return; 
            if(updateUI) document.querySelector('#current-station-text').innerText = "駅を探しています...";
            return new Promise((resolve) => {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const url = `https://express.heartrails.com/api/json?method=getStations&x=${pos.coords.longitude}&y=${pos.coords.latitude}`;
                    try {
                        const res = await fetch(url); const data = await res.json();
                        if(data.response.station) {
                            currentStation = `${data.response.station[0].line} ${data.response.station[0].name}駅`;
                            isFaked = false;
                            if(updateUI) document.querySelector('#current-station-text').innerText = currentStation + " 付近";
                        }
                    } catch(e) {}
                    resolve();
                }, (err) => {
                    if(updateUI) document.querySelector('#current-station-text').innerText = "位置情報を許可してください";
                    resolve();
                }, { enableHighAccuracy: true, timeout: 5000 });
            });
        }

        document.getElementById('main-refresh-btn').onclick = () => { isFaked = false; getStation(true); };
        document.getElementById('reply-refresh-btn').onclick = () => { isFaked = false; getStation(false); };

        document.getElementById('send-btn').onclick = async () => {
            const input = document.getElementById('message-input');
            if(!input.value.trim()) return;
            const text = input.value;
            const docRef = await addDoc(collection(db, "bottles"), { 
                text: text, station: currentStation, originStation: currentStation, 
                senderId: myUserId, senderName: myName, createdAt: serverTimestamp() 
            });
            saveToLocalHistory('sharedMyBottles', docRef.id, text);
            alert("駅にボトルを置きました！ (" + currentStation + ")"); 
            input.value = "";
        };

        document.getElementById('pick-btn').onclick = async () => {
            const overlay = document.getElementById('bottle-overlay');
            const content = document.getElementById('bottle-content');
            const empty = document.getElementById('empty-message');
            content.style.display = 'none'; empty.style.display = 'none'; overlay.style.display = 'flex';
            const q = query(collection(db, "bottles"), where("station", "==", currentStation), limit(15));
            const snap = await getDocs(q);
            if(!snap.empty) {
                const target = snap.docs[Math.floor(Math.random() * snap.size)];
                showBottleData(target.id, target.data(), false);
            } else { empty.style.display = 'block'; }
        };

        async function showSpecificBottle(id) { 
            const d = await getDoc(doc(db, "bottles", id)); 
            if (d.exists()) { 
                document.getElementById('bottle-overlay').style.display = 'flex';
                showBottleData(id, d.data(), true);
            } 
        }

        function updateStationInfoDisplay(bottleStation, isFromHistory) {
            const infoArea = document.getElementById('station-info-area');
            const debugSuffix = isFaked ? " <span style='color:red; font-size:0.6rem;'>[FAKE]</span>" : "";
            if (isFromHistory) {
                infoArea.innerHTML = `ボトル位置: ${bottleStation}`;
            } else {
                infoArea.innerHTML = `
                    ボトルがある位置: ${bottleStation}<br>
                    ↓<br>
                    ボトルを置く位置: <span class="debug-target">${currentStation}</span>${debugSuffix}
                `;
            }
        }

        function showBottleData(id, data, hideForm) {
            window.lastPickedData = data;
            window.isFromHistory = hideForm;
            document.getElementById('bottle-content').style.display = 'block';
            document.getElementById('empty-message').style.display = 'none';
            document.getElementById('reply-form-area').style.display = hideForm ? 'none' : 'flex';
            const infoArea = document.getElementById('station-info-area');
            infoArea.style.display = 'block';
            updateStationInfoDisplay(data.station, window.isFromHistory);
            const isMyBottle = (data.senderId === myUserId);
            const senderEl = document.getElementById('picked-sender');
            senderEl.innerText = data.senderName;
            senderEl.style.color = isMyBottle ? "#1a2a6c" : "#5dade2"; 
            document.getElementById('picked-text').innerText = data.text; 
            document.getElementById('picked-station').innerText = (data.originStation || data.station) + ' にて';
            loadReplies(id);
            window.currentActiveBottleId = id;
        }

        async function handleReply(targetStation) {
            const input = document.getElementById('reply-input');
            if(!window.currentActiveBottleId || !input.value.trim()) return;
            const text = input.value;
            const bDoc = await getDoc(doc(db, "bottles", window.currentActiveBottleId));
            await addDoc(collection(db, "replies"), { 
                parentId: window.currentActiveBottleId, text: text, 
                senderId: myUserId, senderName: myName, station: targetStation, createdAt: serverTimestamp() 
            });
            await updateDoc(doc(db, "bottles", window.currentActiveBottleId), { station: targetStation });
            saveToLocalHistory('myReplyBottles', window.currentActiveBottleId, bDoc.data().text);
            alert(`${targetStation}に流しました。`);
            closeModals(); input.value = "";
        }

        document.getElementById('reply-back-btn').onclick = async () => {
            const bSnap = await getDoc(doc(db, "bottles", window.currentActiveBottleId));
            handleReply(bSnap.data().station);
        };
        document.getElementById('reply-place-btn').onclick = () => handleReply(currentStation);

        async function loadReplies(id) {
            const q = query(collection(db, "replies"), where("parentId", "==", id), orderBy("createdAt", "asc"));
            const snap = await getDocs(q);
            const listEl = document.getElementById('reply-list');
            listEl.innerHTML = "";
            snap.forEach(r => {
                const rd = r.data();
                const d = document.createElement('div');
                d.style.cssText = "background:#f0f7ff; padding:10px; border-radius:12px; font-size:0.85rem; margin-bottom:10px; text-align:left; display:flex; flex-direction:column; color:#333;";
                d.innerHTML = `<span style="font-size:0.7rem; color:#5dade2; font-weight:bold;">${rd.senderName}</span><span>${rd.text}</span><span style="font-size:0.6rem; color:#99aabb; text-align:right;">${rd.station} にて</span>`;
                listEl.appendChild(d);
            });
        }

        window.openSettings = () => document.getElementById('settings-overlay').style.display = 'flex';
        window.closeModals = () => document.querySelectorAll('.overlay').forEach(el => el.style.display = 'none');
        
        window.copyMyId = async (event) => {
            const btn = event.currentTarget;
            const originalText = btn.innerText;
            try { await navigator.clipboard.writeText(myUserId); btn.innerText = "コピー完了！"; } 
            catch (err) { btn.innerText = "失敗しました"; }
            setTimeout(() => { btn.innerText = originalText; }, 2000);
        };

        window.resetNickname = async () => { const n = prompt("新しい名前:", myName); if(n) { myName = n; localStorage.setItem('ekiUserNickname', n); await updateDoc(doc(db, "users", myUserId), { nickname: n }); location.reload(); } };
        window.resetAll = () => { if(confirm("リセットしますか？")) { localStorage.clear(); location.reload(); } };
        window.importUser = async () => {
            const id = document.getElementById('import-id-input').value.trim();
            const uDoc = await getDoc(doc(db, "users", id));
            if(uDoc.exists()) { localStorage.setItem('ekiUserId', id); location.reload(); }
        };

        window.onload = async () => { await initUser(); getStation(); };
    </script>
</body>
</html>
