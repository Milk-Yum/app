<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eki Bottle Mail (Debug)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍾</text></svg>">
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: linear-gradient(180deg, #a1c4fd 0%, #c2e9fb 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; color: #334d66; padding-bottom: 100px; }
        .container { width: 90%; max-width: 400px; margin-top: 20px; text-align: center; }
        .user-profile { font-size: 0.8rem; color: #ffffff; background: rgba(0,0,0,0.1); padding: 5px 15px; border-radius: 20px; margin-bottom: 20px; display: inline-block; }
        h1 { font-size: 1.5rem; color: #ffffff; text-shadow: 1px 1px 4px rgba(0,0,0,0.1); margin-top: 0; }
        .station-box { background: rgba(255, 255, 255, 0.6); padding: 15px; border-radius: 20px; margin-bottom: 20px; font-weight: bold; cursor: pointer; border: 2px dashed #e74c3c; color: #e74c3c; }
        .sub-text { font-size: 0.7rem; display: block; margin-top: 4px; opacity: 0.8; }
        .bottle-card { background: #ffffff; padding: 25px; border-radius: 30px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        textarea { width: 100%; height: 100px; border: 1px solid #e0e7ff; border-radius: 15px; padding: 12px; font-size: 16px; resize: none; }
        .btn-send { background: #5dade2; color: white; border: none; padding: 15px; border-radius: 50px; font-weight: bold; cursor: pointer; }
        .history-section { width: 100%; text-align: left; margin-top: 20px; }
        .history-item { background: rgba(255, 255, 255, 0.5); padding: 12px; border-radius: 15px; margin-bottom: 8px; font-size: 0.85rem; cursor: pointer; }
        .btn-pick-up { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: white; border: none; border-radius: 50%; width: 70px; height: 70px; font-size: 40px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); cursor: pointer; z-index: 10; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal { background: white; padding: 20px; border-radius: 20px; width: 85%; text-align: center; max-width: 350px; max-height: 85vh; overflow-y: auto; }
        
        #picked-sender { font-size: 0.75rem; color: #5dade2; font-weight: bold; margin-bottom: 5px; text-align: left; }
        #picked-text { font-size: 1.1rem; line-height: 1.5; margin-bottom: 5px; text-align: left; border-left: 3px solid #a1c4fd; padding-left: 10px; }
        #picked-station { font-size: 0.65rem; color: #99aabb; text-align: right; font-style: italic; margin-bottom: 15px; }

        .station-divider { border-top: 1px dashed #ccddee; border-bottom: 1px dashed #ccddee; padding: 8px 0; margin: 15px 0; font-size: 0.75rem; color: #8899aa; cursor: pointer; }
        .station-divider span { color: #e74c3c; font-weight: bold; text-decoration: underline; }

        .reply-item { background: #f0f7ff; padding: 10px 12px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 12px; text-align: left; display: flex; flex-direction: column; }
        .reply-sender { font-size: 0.7rem; color: #5dade2; font-weight: bold; }
        .reply-location { font-size: 0.65rem; color: #99aabb; text-align: right; font-style: italic; }
        .btn-reply-send { background: #a1c4fd; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-profile">あなたは <span id="my-name-display">...</span> です</div>
        <h1>Eki Bottle (Debug)</h1>
        <div class="station-box" onclick="debugChangeStation()">
            <span id="main-station-name">駅を擬装してください</span>
            <span class="sub-text">(タップで位置を擬装)</span>
        </div>
        <div class="bottle-card">
            <textarea id="message-input" placeholder="デバッグ投稿..."></textarea>
            <button id="send-btn" class="btn-send">この駅に流す</button>
        </div>
        <div class="history-section">
            <div id="my-bottles-list"></div>
            <div id="my-replies-list" style="margin-top:20px;"></div>
        </div>
    </div>

    <button id="pick-btn" class="btn-pick-up">🍾</button>

    <div id="overlay">
        <div class="modal">
            <div id="picked-sender"></div>
            <p id="picked-text"></p>
            <div id="picked-station"></div>
            <div class="station-divider" onclick="debugChangeStation()">
                現在の位置(擬装): <span id="current-station-name">未設定</span>
            </div>
            <div id="reply-list"></div>
            <div class="reply-input-area" id="reply-form-area" style="margin-top:15px;">
                <textarea id="reply-input" style="width:100%; height:60px; margin-bottom:10px; border:1px solid #eee; border-radius:10px;" placeholder="返信..."></textarea>
                <button id="reply-send-btn" class="btn-reply-send">返信して流す</button>
            </div>
            <button onclick="document.getElementById('overlay').style.display='none'" style="margin-top:20px; border:none; background:#eee; padding:10px; border-radius:20px; width:100%;">戻る</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDoc, getDocs, query, limit, serverTimestamp, updateDoc, increment, doc, where, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4-mJxug55N26rxomekf1Tvn9YgToacTY",
            authDomain: "nakami-88027.firebaseapp.com",
            projectId: "nakami-88027",
            storageBucket: "nakami-88027.firebasestorage.app",
            messagingSenderId: "316064567852",
            appId: "1:316064567852:web:85642cd678d7b4160b7789"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentStation = "どこかの駅", currentBottleId = null, myName = "";

        function initMyName() {
            myName = localStorage.getItem('ekiUserNickname') || "デバッグさん";
            document.getElementById('my-name-display').innerText = myName;
        }

        window.debugChangeStation = () => {
            const c = prompt("駅名を入力:");
            if (c) {
                currentStation = c;
                document.getElementById('main-station-name').innerText = "【擬】" + currentStation;
                document.getElementById('current-station-name').innerText = currentStation;
            }
        };

        document.getElementById('send-btn').onclick = async () => {
            const input = document.getElementById('message-input');
            const docRef = await addDoc(collection(db, "bottles"), {
                text: input.value, station: currentStation, senderName: myName, createdAt: serverTimestamp(), readCount: 0 
            });
            saveHistory('sharedMyBottles', docRef.id, input.value);
            alert("送信"); input.value = ""; loadAllHistories();
        };

        document.getElementById('pick-btn').onclick = async () => {
            document.getElementById('overlay').style.display = 'flex';
            const q = query(collection(db, "bottles"), where("station", "==", currentStation), limit(10));
            const snap = await getDocs(q);
            if(!snap.empty) {
                const target = snap.docs[0]; currentBottleId = target.id;
                const data = target.data();
                document.getElementById('picked-sender').innerText = data.senderName;
                document.getElementById('picked-text').innerText = data.text;
                document.getElementById('picked-station').innerText = data.station + ' にて';
                loadReplies(target.id);
            }
        };

        document.getElementById('reply-send-btn').onclick = async () => {
            const input = document.getElementById('reply-input');
            await addDoc(collection(db, "replies"), { 
                parentId: currentBottleId, text: input.value, senderName: myName, station: currentStation, createdAt: serverTimestamp() 
            });
            alert("返信完了"); document.getElementById('overlay').style.display = 'none';
        };

        async function loadReplies(id) {
            const q = query(collection(db, "replies"), where("parentId", "==", id), orderBy("createdAt", "asc"));
            const snap = await getDocs(q);
            const list = document.getElementById('reply-list'); list.innerHTML = "";
            snap.forEach(r => {
                const rd = r.data();
                const d = document.createElement('div'); d.className = 'reply-item';
                d.innerHTML = `<span class="reply-sender">${rd.senderName}</span><span>${rd.text}</span><span class="reply-location">${rd.station} にて</span>`;
                list.appendChild(d);
            });
        }

        function saveHistory(k, id, t) {
            let l = JSON.parse(localStorage.getItem(k) || '[]');
            l.unshift({ id, text: t.substring(0,10), date: "" });
            localStorage.setItem(k, JSON.stringify(l.slice(0,5)));
        }

        function loadAllHistories() { /* 簡易化のため省略 */ }

        window.onload = () => { initMyName(); loadAllHistories(); };
    </script>
</body>
</html>
